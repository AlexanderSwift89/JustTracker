# Publishes the `site/` folder (landing page, privacy policy, licences) to GitHub Pages:
# https://alexanderswift89.github.io/JustTracker/ — the URL the app and the RuStore listing link to.
# `enablement: true` switches Pages on with source "GitHub Actions" on the first run (run #2 failed with
# "Get Pages site failed … Not Found" because Pages had never been enabled); no manual setup needed.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

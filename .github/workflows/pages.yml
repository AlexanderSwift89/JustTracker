# Publishes the `site/` folder (landing page, privacy policy, licences) to GitHub Pages:
# https://alexanderswift89.github.io/JustTracker/ — the URL the app and the RuStore listing link to.
# `enablement: true` switches Pages on with source "GitHub Actions" on the first run (run #2 failed with
# "Get Pages site failed … Not Found" because Pages had never been enabled); no manual setup needed.
# Actions are pinned by commit SHA and the checkout keeps no token (SEC-20); update pins as in android.yml.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

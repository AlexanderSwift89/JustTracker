# Builds JustTracker on every push / PR: unit tests + lint + debug APK (workflow artifact for developers:
# debuggable, separate package com.justtracker.app.debug, never for end users).
# On a version tag (v1.1.1) it additionally creates a GitHub Release with notes only — no binaries: users install
# from RuStore (docs/07_security.md SEC-01) — and, when the signing secrets are configured, builds the signed
# release AAB + APK for RuStore as a workflow artifact.
# Secrets: KEYSTORE_BASE64 (base64 of the .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# Every action, first-party actions/* included, is pinned by commit SHA (SEC-05, SEC-20). To update a pin:
#   git ls-remote --tags https://github.com/<owner>/<repo> '<tag>*'   (use the ^{} line for annotated tags)
# See docs/09_release_rustore.md.
name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  build:
    name: Test, lint, build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # Only the base tools: AGP downloads compileSdk 37 / build-tools itself once licenses are accepted.
          packages: "platform-tools"

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # gradle-wrapper.jar must be a published Gradle wrapper; the distribution itself is pinned by
          # distributionSha256Sum in gradle-wrapper.properties.
          validate-wrappers: true

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Rename APK with version
        id: apk
        run: |
          # The default after the elvis: versionName = (project.findProperty("versionName") as String?) ?: "1.1.1"
          VERSION=$(grep -oP 'versionName = .*\?: "\K[^"]+' app/build.gradle.kts | head -1)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read versionName from app/build.gradle.kts (got '$VERSION')"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION"
            exit 1
          fi
          NAME="JustTracker-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "path=android/app/build/outputs/apk/debug/${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK (developers only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release (notes only)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No APK is attached: the debug build is debuggable (run-as exposes the track database) and logs
      # coordinates; the store build is distributed through RuStore only (SEC-01). gh is preinstalled on runners.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --title "JustTracker ${TAG#v}" \
            --notes "Установка — из RuStore: https://www.rustore.ru/catalog/app/com.justtracker.app. Файлы к релизам GitHub не прикладываются. / Install from RuStore; no binaries are attached to GitHub releases."

  release-signed:
    name: Signed AAB + APK for RuStore
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    # `secrets` cannot be used in a job-level `if`; the env indirection makes the job a no-op without them.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.HAS_KEYSTORE == 'true'
        with:
          persist-credentials: false

      - name: Set up JDK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        if: env.HAS_KEYSTORE == 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools"

      - name: Set up Gradle
        if: env.HAS_KEYSTORE == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Restore keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build signed release
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --console=plain

      - name: Upload signed artifacts
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JustTracker-release-signed
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove keystore
        if: always() && env.HAS_KEYSTORE == 'true'
        run: rm -f release.jks keystore.properties
